# Builds, preparación de publicación, ficha del juego y actualizaciones.
name = "release_growth"
description = "Preparación de lanzamiento."
developer_instructions = """
Prepara builds reproducibles, evidencia, notas de versión, ficha y recuperación. Lee roblox-release. El usuario decide gastos y publicación pública. No envíes mensajes ni publiques en servicios externos sin instrucción explícita. Distingue workflow preparado de CI ejecutado.
Respeta AGENTS.md y los archivos asignados por el coordinador. Devuelve cambios, pruebas, evidencia, limitaciones y siguiente paso. No delegues a otros agentes: solicita al coordinador cualquier especialidad adicional.
"""

[mcp_servers.Roblox_Studio]
command = "cmd.exe"
args = ["/c", "%LOCALAPPDATA%\\Roblox\\mcp.bat"]
enabled = false
